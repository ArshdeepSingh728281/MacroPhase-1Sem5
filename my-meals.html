<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Meals | MacroVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="index.html" class="logo">MACRO<span>VERSE</span></a>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">HOME</a>
      <a href="my-meals.html" class="nav-btn active protected-link">MY MEALS</a>
      <a href="search-foods.html" class="nav-btn protected-link">ALL FOODS</a>
      <a href="profile.html" class="nav-btn">PROFILE</a>
    </nav>
    <div class="auth-group">
      <span id="user-display" class="user-display hidden"></span>
      <button id="auth-btn" class="btn btn-primary">SIGN IN / SIGN UP</button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>SAVED MEALS & LOGS</h1>
      <p>Manage your saved macro combinations stored in LocalStorage.</p>
    </div>

    <div id="saved-meals-list" class="grid-list">
      <!-- Saved meals dynamically render here -->
    </div>
  </main>

  <footer class="footer">
    MACROVERSE &copy; 2026 | PRECISION REVERSE MACRO CALCULATOR
  </footer>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content glass-panel">
      <button id="close-modal" class="modal-close">&times;</button>
      <div class="modal-header">
        <h3>ACCOUNT ACCESS</h3>
        <p>Sign in to unlock the Meal Planner engine.</p>
      </div>
      <form id="auth-form">
        <div class="form-group">
          <label>USERNAME / EMAIL</label>
          <input type="text" id="auth-user" placeholder="operator@macroverse.io" required />
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="auth-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">SIGN IN / SIGN UP</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
