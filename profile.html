<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | MacroVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Scoped CSS for Profile Specific Elements (Assuming these aren't in style.css yet) -->
  <style>
    .profile-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 2px solid rgba(15, 23, 42, 0.12);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
    }

    .user-header-box {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid #F1F5F9;
    }

    .user-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #0F172A;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 800;
      border: 3px solid #E85D04;
      box-shadow: 0 0 15px rgba(232, 93, 4, 0.25);
      flex-shrink: 0;
    }

    .user-details h2 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0F172A;
      margin-bottom: 0.2rem;
    }

    .user-details p {
      color: #64748B;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #E85D04;
      margin: 1.5rem 0 1rem 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field-group label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0F172A;
    }

    .field-group input, 
    .field-group select {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: #F1F5F9;
      border: 2px solid transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0F172A;
      outline: none;
      transition: all 0.2s ease;
    }

    .field-group input:focus, 
    .field-group select:focus {
      border-color: #E85D04;
      background: #FFFFFF;
      box-shadow: 0 0 10px rgba(232, 93, 4, 0.25);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 2px solid #F1F5F9;
    }

    .btn-logout {
      background: transparent;
      color: #0F172A;
      border: 2px solid #0F172A;
      padding: 0.85rem 1.5rem;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: #0F172A;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- EXACT NAVBAR -->
  <header class="navbar">
    <a href="index.html" class="logo">MACRO<span>VERSE</span></a>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">HOME</a>
      <a href="my-meals.html" class="nav-btn protected-link">MY MEALS</a>
      <a href="search-foods.html" class="nav-btn protected-link">ALL FOODS</a>
      <a href="profile.html" class="nav-btn active">PROFILE</a>
    </nav>
    <div class="auth-group">
      <span id="user-display" class="user-display hidden"></span>
      <button id="auth-btn" class="btn btn-primary">SIGN IN / SIGN UP</button>
    </div>
  </header>

  <!-- MAIN CONTAINER (Matched to your structure) -->
  <main class="container">
    <!-- <div class="page-header">
      <h1>USER PROFILE</h1>
      <p>Manage your personal metrics, targets, and dietary preferences.</p>
    </div> -->

    <!-- PROFILE EDIT CARD -->
    <div class="profile-wrapper">
      <div class="user-header-box">
        <div class="user-avatar" id="avatar-icon">U</div>
        <div class="user-details">
          <h2 id="user-display-name">User Account</h2>
          <p id="user-display-email">email@domain.com</p>
        </div>
      </div>

      <form id="profile-edit-form">
        <!-- Personal Metrics -->
        <div class="section-title">Personal Metrics</div>
        <div class="form-grid">
          <div class="field-group">
            <label for="p-age">Age (years)</label>
            <input type="number" id="p-age" min="14" max="80" required>
          </div>
          <div class="field-group">
            <label for="p-gender">Gender</label>
            <select id="p-gender">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-height">Height (cm)</label>
            <input type="number" id="p-height" min="120" max="220" required>
          </div>
          <div class="field-group">
            <label for="p-weight">Weight (kg)</label>
            <input type="number" id="p-weight" min="40" max="160" required>
          </div>
          <div class="field-group">
            <label for="p-body_fat">Body Fat (%)</label>
            <input type="number" id="p-body_fat" min="5" max="45" required>
          </div>
        </div>

        <!-- Activity & Lifestyle -->
        <div class="section-title">Activity & Lifestyle</div>
        <div class="form-grid">
          <div class="field-group">
            <label for="p-activity_level">Daily Activity</label>
            <select id="p-activity_level">
              <option value="Sedentary">Sedentary</option>
              <option value="Lightly active">Lightly active</option>
              <option value="Moderately active">Moderately active</option>
              <option value="Very active">Very active</option>
              <option value="Extremely active">Extremely active</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-exercise_days">Exercise Days / Week</label>
            <select id="p-exercise_days">
              <option value="0">0 Days</option>
              <option value="1–2">1–2 Days</option>
              <option value="3–5">3–5 Days</option>
              <option value="6+">6+ Days</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-exercise_type">Primary Exercise Type</label>
            <select id="p-exercise_type">
              <option value="Weight training">Weight Training</option>
              <option value="Cardio">Cardio</option>
              <option value="Sports">Sports</option>
              <option value="Mixed">Mixed Hybrid</option>
              <option value="None">None</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-daily_steps">Daily Steps Target</label>
            <select id="p-daily_steps">
              <option value="<3000">&lt; 3,000 steps</option>
              <option value="3000–7000">3,000 – 7,000 steps</option>
              <option value="7000–10000">7,000 – 10,000 steps</option>
              <option value="10000+">10,000+ steps</option>
            </select>
          </div>
        </div>

        <!-- Goals & Targets -->
        <div class="section-title">Goals & Targets</div>
        <div class="form-grid">
          <div class="field-group">
            <label for="p-primary_goal">Primary Goal</label>
            <select id="p-primary_goal">
              <option value="Lose fat (cutting)">Lose fat (cutting)</option>
              <option value="Maintain current weight">Maintain current weight</option>
              <option value="Gain muscle (lean bulk)">Gain muscle (lean bulk)</option>
              <option value="Gain weight (bulk)">Gain weight (bulk)</option>
              <option value="Improve athletic performance">Improve athletic performance</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-goal_magnitude">Weight Goal Target</label>
            <select id="p-goal_magnitude">
              <option value="Lose/Gain 2–5 kg">2 – 5 kg</option>
              <option value="Lose/Gain 5–10 kg">5 – 10 kg</option>
              <option value="Lose/Gain 10+ kg">10+ kg</option>
              <option value="Not sure">Not sure / Maintain</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-target_timeline">Timeline</label>
            <select id="p-target_timeline">
              <option value="1–3 months">1 – 3 Months</option>
              <option value="3–6 months">3 – 6 Months</option>
              <option value="6+ months">6+ Months</option>
              <option value="No specific timeline">No specific timeline</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-goal_speed">Pace/Speed</label>
            <select id="p-goal_speed">
              <option value="Slowly (more sustainable)">Slowly</option>
              <option value="Moderately">Moderately</option>
              <option value="Aggressively">Aggressively</option>
            </select>
          </div>
        </div>

        <!-- Nutrition & Preferences -->
        <div class="section-title">Nutrition & Preferences</div>
        <div class="form-grid">
          <div class="field-group">
            <label for="p-diet_preference">Diet Type</label>
            <select id="p-diet_preference">
              <option value="Vegetarian">Vegetarian</option>
              <option value="Non-vegetarian">Non-Vegetarian</option>
              <option value="Vegan">Vegan</option>
              <option value="Eggetarian">Eggetarian</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-meals_per_day">Meals Per Day</label>
            <select id="p-meals_per_day">
              <option value="2">2 Meals</option>
              <option value="3">3 Meals</option>
              <option value="4">4 Meals</option>
              <option value="5+">5+ Meals</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-allergies">Allergies / Restrictions</label>
            <select id="p-allergies">
              <option value="None">None</option>
              <option value="Lactose Intolerant">Lactose Intolerant</option>
              <option value="Gluten Free">Gluten Free</option>
              <option value="Nut Allergy">Nut Allergy</option>
            </select>
          </div>
          <div class="field-group">
            <label for="p-weight_trend">Current Weight Trend</label>
            <select id="p-weight_trend">
              <option value="Increasing">Increasing</option>
              <option value="Stable">Stable</option>
              <option value="Decreasing">Decreasing</option>
            </select>
          </div>
        </div>

        <div class="action-bar">
          <button type="button" id="profile-logout-btn" class="btn-logout">LOGOUT</button>
          <button type="submit" class="btn btn-primary">SAVE CHANGES</button>
        </div>
      </form>
    </div>
  </main>

  <!-- EXACT FOOTER -->
  <footer class="footer">
    MACROVERSE &copy; 2026 | PRECISION REVERSE MACRO CALCULATOR
  </footer>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content glass-panel">
      <button id="close-modal" class="modal-close">&times;</button>
      <div class="modal-header">
        <h3>ACCOUNT ACCESS</h3>
        <p>Sign in to unlock the Meal Planner engine.</p>
      </div>
      <form id="auth-form">
        <div class="form-group">
          <label>USERNAME / EMAIL</label>
          <input type="text" id="auth-user" placeholder="operator@macroverse.io" required />
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="auth-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">SIGN IN / SIGN UP</button>
      </form>
    </div>
  </div>

  <!-- EXTERNAL SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <!-- PAGE SPECIFIC LOGIC -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = localStorage.getItem('mv_user');
      
      // Safety check just in case auth.js doesn't boot them fast enough
      if (!currentUser) {
        window.location.href = 'index.html';
        return;
      }

      // Populate user header card
      document.getElementById('user-display-email').textContent = currentUser;
      document.getElementById('user-display-name').textContent = currentUser.split('@')[0];
      document.getElementById('avatar-icon').textContent = currentUser.charAt(0).toUpperCase();

      const userProfiles = JSON.parse(localStorage.getItem('mv_user_profiles')) || {};
      const profile = userProfiles[currentUser] || {};

      // Hydrate form inputs from storage
      const fields = [
        'age', 'gender', 'height', 'weight', 'body_fat',
        'activity_level', 'exercise_days', 'exercise_type', 'daily_steps',
        'primary_goal', 'goal_magnitude', 'target_timeline', 'goal_speed',
        'diet_preference', 'meals_per_day', 'allergies', 'weight_trend'
      ];

      fields.forEach(field => {
        const input = document.getElementById(`p-${field}`);
        if (input && profile[field] !== undefined) {
          input.value = profile[field];
        }
      });

      // Submit Form Handler
      document.getElementById('profile-edit-form').addEventListener('submit', (e) => {
        e.preventDefault();

        fields.forEach(field => {
          const input = document.getElementById(`p-${field}`);
          if (input) {
            profile[field] = input.value;
          }
        });

        userProfiles[currentUser] = profile;
        localStorage.setItem('mv_user_profiles', JSON.stringify(userProfiles));
        
        alert('Profile updated successfully!');
      });

      // Profile-Specific Logout Button (since you have one on the form)
      document.getElementById('profile-logout-btn').addEventListener('click', () => {
        localStorage.removeItem('mv_user');
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
