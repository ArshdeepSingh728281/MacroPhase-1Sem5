



<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Foods | MacroVerse</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">


  <style>

    .food-search-header {
      margin-bottom: 2rem;
    }


    .food-search-header h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }


    .food-search-header p {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-weight: 600;
    }


    .search-box-wrapper {
      margin-bottom: 2.5rem;
    }


    .glass-input {

      width: 100%;
      padding: 1rem 1.2rem;

      border-radius: var(--radius);

      border: 1px solid var(--border-color);

      background: rgba(255,255,255,0.85);

      font-size: 1rem;

      font-weight: 700;

      color: var(--navy);

      outline: none;

      transition: all .2s ease;
    }


    .glass-input:focus {

      border-color: var(--orange);

      box-shadow: 0 0 15px rgba(232,93,4,0.15);

    }


    .grid-list {

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(280px,1fr));

      gap:1.5rem;

    }


    .food-card {

      overflow:hidden;

      padding:0;

    }


    .food-card-img {

      width:100%;

      height:180px;

      object-fit:cover;

      border-bottom:1px solid var(--border-color);

    }


    .food-card-body {

      padding:1.25rem;

    }


    .food-card-title {

      font-size:1.2rem;

      font-weight:900;

      text-transform:uppercase;

      margin-bottom:.5rem;

    }


    .food-card-meta {

      font-size:.8rem;

      color:var(--text-muted);

      font-weight:700;

      margin-bottom:1rem;

    }


    .tag-group {

      display:flex;

      flex-wrap:wrap;

      gap:.4rem;

      margin-bottom:1rem;

    }


    .tag {

      background:#E2E8F0;

      color:var(--navy);

      padding:.3rem .6rem;

      font-size:.7rem;

      font-weight:800;

      border-radius:4px;

      text-transform:uppercase;

    }


    .tag-orange {

      background:var(--orange);

      color:white;

    }


    .macro-stats {

      display:flex;

      justify-content:space-between;

      flex-wrap:wrap;

      gap:.5rem;

      font-size:.8rem;

      font-weight:900;

    }


    .empty-state {

      text-align:center;

      padding:3rem;

      font-weight:800;

      color:var(--text-muted);

    }


  </style>

</head>


<body>


<header class="navbar">

  <a href="index.html" class="logo">
    MACRO<span>VERSE</span>
  </a>


  <nav class="nav-links">

    <a href="index.html" class="nav-btn">
      HOME
    </a>


    <a href="my-meals.html" class="nav-btn protected-link">
      MY MEALS
    </a>


    <a href="search-foods.html" class="nav-btn active protected-link">
      ALL FOODS
    </a>


    <a href="profile.html" class="nav-btn">
      PROFILE
    </a>


  </nav>


  <div class="auth-group">

    <span id="user-display" class="user-display hidden"></span>

    <button id="auth-btn" class="btn btn-primary">
      SIGN IN / SIGN UP
    </button>

  </div>


</header>




<main class="container food-page">


<div class="food-layout">


<!-- LEFT SIDEBAR -->

<aside class="food-sidebar glass-panel">


<h3>
SEARCH & FILTER
</h3>



<label>
Search Foods
</label>

<input 
id="food-search-input"
class="glass-input"
placeholder="Search (Paneer, Chicken, Oats...)"
/>





<label>
Food Type
</label>

<select id="type-filter" class="glass-input">

<option value="">
All Types
</option>

</select>





<label>
Category
</label>

<select id="category-filter" class="glass-input">

<option value="">
All Categories
</option>

</select>





<label>
Meal Type
</label>

<select id="meal-filter" class="glass-input">

<option value="">
All Meal Types
</option>

</select>





<label>
Diet Tags
</label>

<select id="tag-filter" class="glass-input">

<option value="">
All Diet Tags
</option>

</select>





<label>
Taste
</label>

<select id="taste-filter" class="glass-input">

<option value="">
All Tastes
</option>

</select>





<label>
Minimum Protein (g)
</label>

<input 
id="protein-filter"
type="number"
class="glass-input"
placeholder="e.g. 20"
/>





<label>
Maximum Calories
</label>

<input 
id="calorie-filter"
type="number"
class="glass-input"
placeholder="e.g. 500"
/>




<button 
class="btn btn-primary btn-full"
id="apply-filter">

APPLY FILTERS

</button>



<button 
class="btn btn-secondary btn-full"
id="reset-filter">

RESET FILTERS

</button>



</aside>







<section class="food-content">



<div class="food-header">


<div>

<h1>
FOOD DATABASE SEARCH
</h1>


<p>
Browse 600+ nutrition profiles with calories and macro breakdown.
</p>


</div>



<select id="sort-foods" class="glass-input">

<option>
Name (A-Z)
</option>


<option>
Calories Low-High
</option>


<option>
Protein High-Low
</option>


</select>


</div>




<div class="food-count">

<span id="food-count">
Showing 1-10 of 600 foods
</span>

</div>





<div id="food-db-grid" class="food-grid">


</div>





<div id="pagination" class="pagination">


</div>



</section>



</div>


</main>





<footer class="footer">

MACROVERSE &copy; 2026 | PRECISION REVERSE MACRO CALCULATOR

</footer>






<!-- AUTH MODAL -->

<div id="auth-modal" class="modal-overlay hidden">


<div class="modal-content glass-panel">


<button id="close-modal" class="modal-close">
&times;
</button>


<div class="modal-header">

<h3>
ACCOUNT ACCESS
</h3>


<p>
Sign in to unlock the Meal Planner engine.
</p>


</div>




<form id="auth-form">


<div class="form-group">

<label>
USERNAME / EMAIL
</label>


<input 
type="text"
id="auth-user"
placeholder="operator@macroverse.io"
required
>


</div>




<div class="form-group">


<label>
PASSWORD
</label>


<input 
type="password"
id="auth-pass"
placeholder="••••••••"
required
>


</div>




<button class="btn btn-primary btn-full">

SIGN IN / SIGN UP

</button>



</form>


</div>


</div>






<script src="js/data.js"></script>

<script src="js/auth.js"></script>

<script src="js/app.js"></script>



</body>

</html>
